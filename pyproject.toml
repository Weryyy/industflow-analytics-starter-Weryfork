[project]
name = "industflow-analytics-starter"
version = "0.1.0"
description = "Import and explore an Industflow manufacturing data slice"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tomas Krcka", email = "tomas.krcka@industware.cloud" }]
dependencies = [
    "pymongo>=4.6",
    "tabulate>=0.9",
]

[project.optional-dependencies]
ai = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # create_agent (langchain.agents) is a LangChain v1 API.
    "langchain>=1.0",
    "langchain-ollama>=0.1",
    "apscheduler>=3.10",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[project.scripts]
mip = "industflow_starter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["industflow_starter", "industflow_ai"]
