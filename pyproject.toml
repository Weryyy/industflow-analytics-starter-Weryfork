[project]
name = "industflow-analytics-starter"
version = "0.1.0"
description = "Import and explore an Industflow manufacturing data slice"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tomas Krcka", email = "tomas.krcka@industware.cloud" }]
dependencies = [
    "pymongo>=4.6",
    "tabulate>=0.9",
]

[project.scripts]
mip = "industflow_starter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["industflow_starter"]
