# MongoDB 7 for the Industflow AI layer.
#   docker compose up -d   → Mongo on localhost:27017, database `mip`
# Mongo 7 is required for $median / $percentile used by some aggregations.
services:
  mongo:
    image: mongo:7
    container_name: industflow-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Opt-in (CPU-only) Ollama for machines without a native install:
  #   docker compose --profile ollama up -d
  #   docker exec industflow-ollama ollama pull qwen3:14b-q4_K_M
  # GPU users should prefer the native Ollama install (see AI_LAYER.md).
  ollama:
    image: ollama/ollama:latest
    container_name: industflow-ollama
    profiles: ["ollama"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  mongo_data:
  ollama_data:
